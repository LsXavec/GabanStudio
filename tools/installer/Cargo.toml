[package]
name = "animstudio-installer"
version = "0.1.14"
edition = "2024"

# PSD-shipping NEVER-DO 5: the installer is OUR OWN binary — no
# third-party installer framework. It embeds the release exe at build
# time, so `cargo build --release -p animstudio` must run first.

[[bin]]
name = "AnimStudio-Setup"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1.31"

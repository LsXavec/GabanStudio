[package]
name = "animstudio"
version = "0.1.0"
edition = "2024"
description = "Node-graph 2D animation studio - app shell"

[dependencies]
anim-core = { path = "../crates/anim-core" }
eframe = { version = "0.35.0", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
wgpu = "29"
rfd = "0.15"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
egui_dock = { version = "0.20", features = ["serde"] }
octotablet = "0.1.0"
raw-window-handle = "0.6"
# Audio scratch-track playback (decoded samples come from anim-core; no
# format decoders needed here — playback feature only).
rodio = { version = "0.21", default-features = false, features = ["playback"] }

[package]
name = "animstudio"
version = "0.6.2"
edition = "2024"
description = "Node-graph 2D animation studio - app shell"

[dependencies]
anim-core = { path = "../crates/anim-core" }
eframe = { version = "0.35.0", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
wgpu = "29"
rfd = "0.15"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
egui_dock = { version = "=0.20.1", features = ["serde"] }
octotablet = "0.1.0"
raw-window-handle = "0.6"
# Audio scratch-track playback (decoded samples come from anim-core; no
# format decoders needed here â€” playback feature only).
rodio = { version = "0.21", default-features = false, features = ["playback"] }
sha1 = "0.11.0"
hmac = "0.13.0"
rand = "0.10.2"
ureq = "3.4.0"
flate2 = "1.1.9"
# GM19: the sample cut's dialogue track is generated in code (hound is
# already locked through anim-core).
hound = "3"

# Release builds use the GUI subsystem (no console window); CLI flags such
# as the layout probe re-attach to the parent terminal (GM1). GM2: the
# running records' liveness check (Threading) and the recovery rows' local
# time (Time).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Time",
] }

[dev-dependencies]
# WGSL shader-string validation in tests: cargo check can't see inside the
# shader source constants, and a typo there is otherwise a STARTUP PANIC.
# Same major as wgpu (they release in lockstep).
naga = { version = "29", features = ["wgsl-in"] }
# The headless UI testkit (GM1, testkit.rs): AccessKit queries with no
# window, no wgpu device and no audio device.
egui_kittest = { version = "0.35", default-features = false, features = ["wgpu"] }
tempfile = "3"
# GM2: the save-keeps-unknown-tables test plants a table the build does not
# know (same version anim-core links; already in the lock file).
rusqlite = { version = "0.37", features = ["bundled"] }
# AU8: the tests read a written GIF back through anim-core's test decoder.
weezl = "0.1"

[build-dependencies]
winresource = "0.1.31"

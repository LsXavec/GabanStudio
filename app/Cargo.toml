[package]
name = "animstudio"
version = "0.1.13"
edition = "2024"
description = "Node-graph 2D animation studio - app shell"

[dependencies]
anim-core = { path = "../crates/anim-core" }
eframe = { version = "0.35.0", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
wgpu = "29"
rfd = "0.15"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
egui_dock = { version = "0.20", features = ["serde"] }
octotablet = "0.1.0"
raw-window-handle = "0.6"
# Audio scratch-track playback (decoded samples come from anim-core; no
# format decoders needed here — playback feature only).
rodio = { version = "0.21", default-features = false, features = ["playback"] }
sha1 = "0.11.0"
hmac = "0.13.0"
rand = "0.10.2"
ureq = "3.4.0"

[dev-dependencies]
# WGSL shader-string validation in tests: cargo check can't see inside the
# shader source constants, and a typo there is otherwise a STARTUP PANIC.
# Same major as wgpu (they release in lockstep).
naga = { version = "29", features = ["wgsl-in"] }

[build-dependencies]
winresource = "0.1.31"

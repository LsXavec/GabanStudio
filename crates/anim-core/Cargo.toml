[package]
name = "anim-core"
version = "0.1.0"
edition = "2024"
description = "Headless engine for the node-graph 2D animation suite: document model, X-sheet, cached graph evaluator, undo, SQLite persistence."

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
png = "0.17"
# WAV decode for the audio scratch track (pure decoder — no audio I/O; the
# engine stays headless, playback lives in the app).
hound = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
bytemuck = "1"
# GM9 (D9, D16): the compositing FX run once, here, on the CPU — parallel
# over rows.
rayon = "1.12"
# GM11 (D16): delivery writers. PNG16 and TIFF16 through image (png and
# tiff are locked); image writes EXR only as f32, so the half-float EXR goes
# through the exr crate its own `exr` feature builds on (both fetched).
image = { version = "0.25", default-features = false, features = ["png", "tiff", "exr", "jpeg"] }
exr = { version = "1.74", default-features = false }
# GM11: burn-in text — the app's Plex outlines rasterised on the CPU.
ab_glyph = "0.2"
# GM12 (D16): sound tracks — WAV, MP3, OGG Vorbis and FLAC decoded in pure
# Rust (fetched). The engine only decodes and mixes; playback is the app's.
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "mp3", "ogg", "vorbis", "flac"] }
# GM17 (D16): 3D layout — glTF (binary, or with its buffers embedded) and
# OBJ read from the bytes embedded in `cut_models` (fetched). JPEG import
# and sequences ride image's `jpeg` feature above.
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names"] }
tobj = { version = "4", default-features = false }
# GM18 (D16): page export — TIFF with its resolution tags and 1-bit mono,
# which image does not write (tiff 0.11 is already locked under image).
tiff = "0.11"
# AU8: the GIF writer's LZW (0.1.12 is already locked under tiff; no gif crate
# is fetched).
weezl = "0.1"

[dev-dependencies]
# Tests forge legacy (schema v4/v5) project files directly to prove migration.
rusqlite = { version = "0.37", features = ["bundled"] }
# Image tests encode their fixture PNGs in-test.
png = "0.17"
# GM11 (D16): delivery tests write their frames into a temp dir.
tempfile = "3"

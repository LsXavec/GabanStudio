[package]
name = "anim-core"
version = "0.1.0"
edition = "2024"
description = "Headless engine for the node-graph 2D animation suite: document model, X-sheet, cached graph evaluator, undo, SQLite persistence."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"

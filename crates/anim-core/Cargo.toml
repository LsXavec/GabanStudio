[package]
name = "anim-core"
version = "0.1.0"
edition = "2024"
description = "Headless engine for the node-graph 2D animation suite: document model, X-sheet, cached graph evaluator, undo, SQLite persistence."

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
png = "0.17"
# WAV decode for the audio scratch track (pure decoder — no audio I/O; the
# engine stays headless, playback lives in the app).
hound = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
bytemuck = "1"
# GM9 (D9, D16): the compositing FX run once, here, on the CPU — parallel
# over rows.
rayon = "1.12"
# GM11 (D16): delivery writers. PNG16 and TIFF16 through image (png and
# tiff are locked); image writes EXR only as f32, so the half-float EXR goes
# through the exr crate its own `exr` feature builds on (both fetched).
image = { version = "0.25", default-features = false, features = ["png", "tiff", "exr"] }
exr = { version = "1.74", default-features = false }
# GM11: burn-in text — the app's Plex outlines rasterised on the CPU.
ab_glyph = "0.2"

[dev-dependencies]
# Tests forge legacy (schema v4/v5) project files directly to prove migration.
rusqlite = { version = "0.37", features = ["bundled"] }
# Image tests encode their fixture PNGs in-test.
png = "0.17"
# GM11 (D16): delivery tests write their frames into a temp dir.
tempfile = "3"

[workspace]
resolver = "2"
members = ["app", "m0_spike", "crates/anim-core", "tools/iconforge", "tools/installer"]

# Fast iteration: our crates compile quick, dependencies stay optimized
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
